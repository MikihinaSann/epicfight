name: Label issues
on:
  issues:
    types:
      - opened
jobs:
  label_issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:

      - name: Check user permission
        id: check
        uses: scherermichael-oss/action-has-permission@master
        with:
          required-permission: write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set label
        id: setlabel
        run: |
          if [ "${{ steps.check.outputs.has-permission }}" = "true" ]; then
            echo "label=core contributor" >> "$GITHUB_OUTPUT"
          else
            echo "label=triage" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply label
        run: gh issue edit "$NUMBER" --add-label "$LABEL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ steps.setlabel.outputs.label }}
